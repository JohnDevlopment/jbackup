[tool.poetry]
name = "jbackup"
version = "2.0b2"
description = "Extensible backup system"
authors = ["JohnDevlopment <50782633+JohnDevlopment@users.noreply.github.com>"]
license = "GPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
tomli = {markers = "python_version < \"3.11\"", version = "^2.0.1"}
tomli-w = "^1.0.0"
platformdirs = "^4.2.2"
typer = ">=0.12.3"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"
pytest-cov = "^5.0.0"
pytest-dotenv = "^0.5.2"
pylint = "^3.2.6"
icecream = "^2.1.3"
basedpyright = "^1.17.1"

[tool.poetry.scripts]
jbackup = "jbackup.run:app"

[[tool.poetry.source]]
name = "dev"
url = "http://localhost:5014/root/pypi/+simple"
priority = "primary"

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"
defineConstant = { DEBUG = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
